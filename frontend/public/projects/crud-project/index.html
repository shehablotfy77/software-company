<div class="container py-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
           <h3><i class="bi bi-journal-bookmark-fill"></i>اداره المقالات</h3>
        </div>
        <div class="card-body">
           <form id="articleForm">
             <div class="mb-3">
                <label class="form-label">عنوان المقالة</label>
                <input type="text" class="form-control" id="title">
             </div>

             <div class="mb-3">
                <label class="form-label">محتوى المقاله</label>
                <textarea  type="text" class="form-control" id="content" rows="4"></textarea>
             </div>

              <div class="d-grid">

                <button class="btn btn-primary" type="submit">
                   <h4>اضافه المقالة <i class="bi bi-send-plus"></i></h4>
               </button>

              </div>

           </form>

           <hr>

            <div id="articlesList" class="mt-4">
                <!-- المقالات هنا-->
          </div>
        </div>

    </div>
</div>







<!-- Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">تعديل المقاله</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
       <form id="editForm">
            <input type="hidden" id="editId">
         <div class="mb-3">
                <label for="editTitle" class="form-label">العنوان</label>
                <input type="text" class="form-control" id="editTitle" required>
        </div>
         <div class="mb-3">
        <label for="editContent" class="form-label">المحتوي</label>
         <textarea id="editContent" class="form-control" rows="4" required></textarea>
       </div>
       </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">الغاء</button>
        <button type="button" class="btn btn-primary" id ="saveChanges">حفظ</button>
      </div>
    </div>
  </div>
</div>
